<div class="box">
	<h2>Global</h2>
	<p>You can reset all competitions data at once.
		This will drop and re-import competition data, while keeping users and bets.</p>
	<div class="actions">
		<button onclick="page.reset();">Reset all competitions</button>
	</div>
</div>

<!-- BEGIN: active -->
<div class="box">
	<h2>Active competition: {name}</h2>
	<div id="jobs"></div>

	<div class="actions">
		<button onclick="page.getJobs('{year}');">Check running jobs</button>
		<button onclick="page.schedule('{year}');">Start scheduler</button>
		<button onclick="page.unschedule('{year}');">Stop scheduler</button>
	</div>
</div>
<!-- END: active -->

<div class="box">
	<h2>Available competitions</h2>
	<table class="list">
	<thead>
		<tr>
			<th>Year</th>
			<th>Competition</th>
			<th><span class="info" title="Normal: from database&#013;Light: from filesystem">Type</span></th>
			<th><span class="info" title="Retrieves data from filesystem and logs it in the console">Preview</span></th>
			<th><span class="info" title="Imports data from filesystem into database">Import</span></th>
			<th><span class="info" title="Exports data from database and logs it in the console">Export</span></th>
		</tr>
	</thead>

	<tbody>
		<!-- BEGIN: competition -->
		<tr class="{row_class}">
			<td>{year}</td>
			<td>{name}</td>
			<td>{type}</td>
			<td><a onclick="page.preview('{year}', event);" href="#">Preview</a></td>
			<td><a onclick="page.import('{year}', event);" href="#">Import</a></td>
			<td><a onclick="page.export('{year}', event);" href="#">Export</a></td>
		</tr>
		<!-- END: competition -->
	</tbody>
	</table>
</div>
